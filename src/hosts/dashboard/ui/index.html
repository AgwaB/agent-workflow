<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>agent-workflow</title>
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./vendor/shiki/colours.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div
      id="global-progress"
      role="progressbar"
      aria-label="Loading dashboard"
      hidden
    ></div>
    <a id="skip-content" class="skip-link" href="#center">Skip to content</a>
    <div id="app">
      <header id="top" class="top"></header>
      <div id="body" class="body">
        <aside id="rail" class="rail" aria-label="Runs"></aside>
        <main id="center" class="center" tabindex="-1">
          <span class="sr-only" role="status" aria-label="Loading dashboard"
            >Loading dashboard</span
          >
        </main>
        <aside
          id="inspector"
          class="inspector"
          aria-label="Inspector"
          hidden
        ></aside>
      </div>
      <div id="rail-scrim" class="rail-scrim"></div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="notice" role="status" aria-live="polite" hidden></div>
  </body>
</html>
